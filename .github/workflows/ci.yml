name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version:
          - "3.13.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Python and Java versions
        run: |
          python --version
          java --version

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run unit tests
        run: |
          pytest tests -v

      - name: Validate YAML configuration
        run: |
          python -c "
          from pathlib import Path
          from omegaconf import OmegaConf

          yaml_files = sorted(Path('config').rglob('*.yaml'))

          if not yaml_files:
              raise SystemExit('No YAML configuration files found.')

          for path in yaml_files:
              OmegaConf.load(path)
              print(f'OK: {path}')

          print(f'Validated {len(yaml_files)} YAML configuration files.')
          "